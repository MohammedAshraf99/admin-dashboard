<div class="p-3 rounded-lg bg-white mt-2">
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">
      <!-- Position Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef>Item Name</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex gap-2 justify-content-center items-center">
            <img src="./assets/img/data-analytics_11389924.png" alt="" class="w-10 h-10 rounded-full border-none" />
            <strong> iphone </strong>
          </div>
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Qty</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="weight">
        <th mat-header-cell *matHeaderCellDef>Order Date</th>
        <td class="text-gray-400" mat-cell *matCellDef="let element">
          {{ element.weight }}
        </td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="symbol">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let element">
          <strong>
            {{ element.symbol }}
          </strong>
        </td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          @switch(element.status.code){ @case (0){
          <span class="bg-green-200 p-1 rounded text-green-400">
            {{ element.status.statusName }}
          </span>
          } @case(1){
          <span class="bg-red-200 p-1 rounded text-red-400">
            {{ element.status.statusName }}
          </span>
          } @case(2){
          <span class="bg-blue-200 p-1 rounded text-blue-400">
            {{ element.status.statusName }}
          </span>
          } }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      aria-label="Select page of periodic elements"
    >
    </mat-paginator>
  </div>
</div>
